<style>

    --accent-soft: #dbeafe;
    --new: #16a34a;
    --new-soft: #dcfce7;
    --mod: #d97706;
    --mod-soft: #fef3c7;
    --ctx: #6b7280;
    --ctx-soft: #f3f4f6;
    --test: #7c3aed;
    --test-soft: #ede9fe;
    --done: #9ca3af;
    --warn-soft: #fff7ed;
    --warn: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1418;
      --card: #171d24;
      --ink: #e4e8ee;
      --muted: #94a0ae;
      --line: #273039;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --new: #4ade80;
      --new-soft: #14361f;
      --mod: #fbbf24;
      --mod-soft: #3b2f0b;
      --ctx: #9aa3ad;
      --ctx-soft: #23272d;
      --test: #a78bfa;
      --test-soft: #2b2145;
      --done: #6b7280;
      --warn-soft: #3a2411;
      --warn: #fb923c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1418;
    --card: #171d24;
    --ink: #e4e8ee;
    --muted: #94a0ae;
    --line: #273039;
    --accent: #60a5fa;
    --accent-soft: #1e3a5f;
    --new: #4ade80;
    --new-soft: #14361f;
    --mod: #fbbf24;
    --mod-soft: #3b2f0b;
    --ctx: #9aa3ad;
    --ctx-soft: #23272d;
    --test: #a78bfa;
    --test-soft: #2b2145;
    --done: #6b7280;
    --warn-soft: #3a2411;
    --warn: #fb923c;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font:
      14px/1.65 "IBM Plex Sans JP",
      "Hiragino Sans",
      "Noto Sans JP",
      system-ui,
      sans-serif;
    font-variant-numeric: tabular-nums;
  }
  code {
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  h1,
  h2,
  h3 {
    text-wrap: balance;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  header h1 {
    font-size: 20px;
    margin: 0 0 6px;
    line-height: 1.4;
  }
  header .meta {
    color: var(--muted);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
  }
  header .meta a {
    color: var(--accent);
    text-decoration: none;
  }
  .progress {
    margin: 14px 0 26px;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress > div {
    height: 100%;
    background: var(--accent);
    width: __PROGRESS_PCT__%;
    transition: width 0.3s;
  }
  @media (prefers-reduced-motion: reduce) {
    .progress > div {
      transition: none;
    }
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
    font-size: 12px;
  }
  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .tag.new {
    background: var(--new-soft);
    color: var(--new);
  }
  .tag.mod {
    background: var(--mod-soft);
    color: var(--mod);
  }
  .tag.ctx {
    background: var(--ctx-soft);
    color: var(--ctx);
  }
  .tag.test {
    background: var(--test-soft);
    color: var(--test);
  }
  .tag.find {
    background: var(--warn-soft);
    color: var(--warn);
  }

    font-size: 12px;
    margin: 34px 0 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  .route {
    margin-bottom: 26px;
  }
  .route h3 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  .stepper {
    position: relative;
    padding-left: 40px;
  }
  .stepper::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 14px;
    bottom: 14px;
    width: 2px;
    background: var(--line);
  }
  .step {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .step .num {
    position: absolute;
    left: -40px;
    top: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--line);
    color: var(--muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }
  .step.done {
    opacity: 0.72;
  }
  .step.done .num {
    background: var(--done);
    border-color: var(--done);
    color: #fff;
  }
  .step.current {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .step.current .num {
    background: var(--accent);
    border-color: var(--accent);

  .step .link b,

<script id="pr-tour-lightbox">
  // 図をクリック（または Enter / Space）で拡大表示する。Esc・背景クリック・✕ で閉じる。
  // SVG・表・ツリーのどれでも同じに扱う。図はコピーせずダイアログへ移し、閉じたら元に戻す
  // （コピーすると SVG のマーカー id がページ内で重複する）。plan-step.py --upgrade はこのブロックを丸ごと差し替える
  (() => {
    const SEL = "details.explain figure";
    const MIN = 0.25, MAX = 6, STEP = 1.25;
    let dlg, view, stage, pct, fig = null, holder = null, z = 1, fitZ = 1, saved = [];

    function build() {
      dlg = document.createElement("dialog");
      dlg.className = "figbox";
      dlg.setAttribute("aria-label", "図の拡大表示");
      dlg.innerHTML =
        '<div class="figbox-bar">' +
        '<button type="button" data-z="fit">全体</button>' +
        '<button type="button" data-z="1">100%</button>' +
        '<button type="button" data-z="out" aria-label="縮小">−</button>' +
        '<button type="button" data-z="in" aria-label="拡大">＋</button>' +
        '<span class="figbox-pct" aria-live="polite"></span>' +
        '<button type="button" class="figbox-close" data-z="close" aria-label="閉じる">✕ 閉じる</button>' +
        "</div>" +
        '<div class="figbox-view"><div class="figbox-stage"></div></div>';
      document.body.append(dlg);
      view = dlg.querySelector(".figbox-view");
      stage = dlg.querySelector(".figbox-stage");
      pct = dlg.querySelector(".figbox-pct");

      dlg.querySelector(".figbox-bar").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const a = b.dataset.z;
        if (a === "close") dlg.close();
        else if (a === "fit") setZoom(fitZ);
        else if (a === "1") setZoom(1);
        else setZoom(z * (a === "in" ? STEP : 1 / STEP));
      });
      // 背景（ダイアログの外側）をクリックしたら閉じる。::backdrop のクリックは dialog 自身に届く
      dlg.addEventListener("click", (e) => {
        if (e.target !== dlg) return;
        const r = dlg.getBoundingClientRect();
        const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        if (!inside) dlg.close();
      });
      dlg.addEventListener("keydown", (e) => {
        if (e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
        if (e.key === "+" || e.key === "=") setZoom(z * STEP);
        else if (e.key === "-") setZoom(z / STEP);
        else if (e.key === "0") setZoom(fitZ);
        else return;
        e.preventDefault();
      });
      view.addEventListener(
        "wheel",
        (e) => {
          if (!e.ctrlKey && !e.metaKey) return;
          e.preventDefault();
          setZoom(z * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
        },
        { passive: false }
      );
      // マウスのドラッグでパンする。表とツリーの上では文字を選べるようにドラッグを使わない
      let drag = null;
      view.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "mouse" || e.button !== 0) return;
        if (e.target.closest("table, ul.fig-tree")) return;
        drag = { x: e.clientX, y: e.clientY, l: view.scrollLeft, t: view.scrollTop };
        view.setPointerCapture(e.pointerId);
        view.classList.add("dragging");
      });
      view.addEventListener("pointermove", (e) => {
        if (!drag) return;
        view.scrollLeft = drag.l - (e.clientX - drag.x);
        view.scrollTop = drag.t - (e.clientY - drag.y);
      });
      const endDrag = () => {
        drag = null;
        view.classList.remove("dragging");
      };
      view.addEventListener("pointerup", endDrag);
      view.addEventListener("pointercancel", endDrag);
      dlg.addEventListener("close", restore);
    }

    function setZoom(next) {
      next = Math.min(MAX, Math.max(MIN, next));
      // 見ている中心を保ったまま倍率を変える
      const cx = (view.scrollLeft + view.clientWidth / 2) / Math.max(view.scrollWidth, 1);
      const cy = (view.scrollTop + view.clientHeight / 2) / Math.max(view.scrollHeight, 1);
      z = next;
      stage.style.zoom = z;
      pct.textContent = Math.round(z * 100) + "%";
      view.scrollLeft = cx * view.scrollWidth - view.clientWidth / 2;
      view.scrollTop = cy * view.scrollHeight - view.clientHeight / 2;
    }

    function open(target) {
      if (!dlg) build();
      fig = target;
      holder = document.createElement("div");
      holder.style.height = fig.offsetHeight + "px";
      fig.replaceWith(holder);
      stage.append(fig);
      // SVG は viewBox の幅を等倍（100%）とする
      saved = [...fig.querySelectorAll("svg")].map((s) => {
        const prev = s.getAttribute("style");
        const vb = s.viewBox && s.viewBox.baseVal;
        if (vb && vb.width) s.style.width = vb.width + "px";
        return [s, prev];
      });
      stage.style.zoom = 1;
      dlg.showModal();
      const pad = 32;
      fitZ = Math.min(
        (view.clientWidth - pad) / Math.max(stage.offsetWidth, 1),
        (view.clientHeight - pad) / Math.max(stage.offsetHeight, 1),
        2
      );
      setZoom(fitZ);
      view.scrollTop = 0;
      view.scrollLeft = 0;
    }

    function restore() {
      if (!fig) return;
      saved.forEach(([s, prev]) => (prev == null ? s.removeAttribute("style") : s.setAttribute("style", prev)));
      holder.replaceWith(fig);
      const f = fig;
      fig = holder = null;
      f.focus({ preventScroll: true });
    }

    document.querySelectorAll(SEL).forEach((f) => {
      f.tabIndex = 0;
      f.title = "クリックで拡大";
    });
    document.addEventListener("click", (e) => {
      if (e.target.closest("a, button, summary, dialog")) return;
      const f = e.target.closest(SEL);
      if (f && !String(window.getSelection())) open(f);
    });
    document.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(SEL)) {
        e.preventDefault();
        open(e.target);
      }
    });
  })();
</script>
<script id="pr-tour-copy">
  // 見る場所・テスト対応・指摘のファイルパスをクリック（または Enter / Space）でコピーする。
  // コピーするのは「パス:開始行」（12-20 なら :12）。エディタのファイル検索や code -g でそのまま開ける。
  // Shift を押しながらならパスだけ。data-copy 属性があればその値をそのままコピーする。
  // Artifact の中では clipboard が拒否される環境があるので、execCommand、テキストの選択の順に落とす。
  // plan-step.py --upgrade はこのブロックを丸ごと差し替える
  (() => {
    const SEL = ".step .files code, table code, ul.findings code, .step .findings code, code[data-copy]";
    const RE = /^([^\s:]+?)(?::(\d+)(?:-\d+)?)?$/;
    let toast, timer;

    function target(el, pathOnly) {
      if (el.dataset.copy) return el.dataset.copy;
      const m = el.textContent.trim().match(RE);
      if (!m) return null;
      const path = m[1];
      if (!path.includes("/") && !/\.\w+$/.test(path)) return null;
      return pathOnly || !m[2] ? path : path + ":" + m[2];
    }

    function show(el, msg) {
      if (!toast) {
        toast = document.createElement("div");
        toast.className = "copy-toast";
        toast.setAttribute("role", "status");
        toast.setAttribute("aria-live", "polite");
        document.body.append(toast);
      }
      toast.textContent = msg;
      const r = el.getBoundingClientRect();
      toast.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 260)) + "px";
      toast.style.top = (r.top > 36 ? r.top - 30 : r.bottom + 6) + "px";
      toast.classList.add("show");
      clearTimeout(timer);
      timer = setTimeout(() => toast.classList.remove("show"), 1500);
    }

    async function copy(el, text) {
      // writeText はクリックのハンドラから同期的に呼ばれる（最初の await より前）
      try {
        await navigator.clipboard.writeText(text);
        return show(el, "コピーしました");
      } catch (_) {}
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
        document.body.append(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        el.focus({ preventScroll: true });
        if (ok) return show(el, "コピーしました");
      } catch (_) {}
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      show(el, "選択しました。⌘C / Ctrl+C でコピー");
    }

    document.querySelectorAll(SEL).forEach((el) => {
      if (el.closest("figure")) return; // 図の中は拡大表示のクリックに任せる
      const t = target(el, false);
      if (!t) return;
      el.classList.add("copyable");
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", "コピー: " + t);
      el.title = "クリックで " + t + " をコピー（Shift+クリックでパスだけ）";
    });
    document.addEventListener("click", (e) => {
      const el = e.target.closest("code.copyable");
      if (!el || String(window.getSelection())) return;
      const t = target(el, e.shiftKey);
      if (t) copy(el, t);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const el = e.target.closest && e.target.closest("code.copyable");
      if (!el) return;
      e.preventDefault();
      const t = target(el, e.shiftKey);
      if (t) copy(el, t);
    });
  })();
</script>
<!--
  テンプレートの使い方（SKILL.md の Phase 4-8 / Phase 5-4）

  置換するプレースホルダ:
    __TITLE__        「PR ツアー #123」のような短い名前（ブラウザタブ・ギャラリーに出る。説明文は付けない）
    __META__         PR タイトル・URL（<a>）・base/head・状態 を <span> で並べる
    __PROGRESS_PCT__ 0（以後は plan-step.py が書き換える）
    __ROUTES__       ルートごとに次の構造を繰り返す
                       <section class="route"><h3>ルート A: 〜</h3><div class="stepper">
                         <article class="step" id="step-1">
                           <div class="num">1</div>
                           <div class="title">ステップ名<span class="star">⭐</span></div>
                           <div class="files"></div>（中身は書かない。plan-step.py --sync がプランの「見る場所」から作る:
                             <div class="loc"><span class="tag ctx">📖 既存</span><code>path:12-20</code><span class="why">何のために見るか</span></div>）
                           <div class="desc"><b>説明:</b> 2〜3 行</div>
                           <div class="tests"><b>テスト:</b> 🧪 tests/... の '...'／なし</div>
                           <div class="findings"><b>指摘:</b> 🔍 #2 CONFIRMED path:57 …／レビュー進行中</div>（指摘が無いステップでは省く）
                           <div class="link"><b>つながり:</b> …</div>
                           <details class="explain"><summary>図解</summary>
                             <p class="pending">このステップに到達したときに図解を追記する。</p>
                           </details>
                         </article>
                       </div></section>
                     補足ステップも同じ構造で <h3>補足</h3> の下に置く。
                     <details class="explain"> の中身は Phase 5 で plan-step.py --figure が置き換える（図は 2 枚まで）。
                     解説の文章はここに書かず、チャットに出す
    __TESTS__        <tr><td>Step 2 Order#cancel</td><td>🧪 <code>tests/...:80-98</code></td><td>…</td><td>…</td></tr>
                     テストが無い行は <td class="none">なし</td>
    __FINDINGS__     <tr><td>2</td><td class="verdict">CONFIRMED</td><td><code>path:57</code></td><td>…</td><td>Step 4</td><td>未実測</td></tr>
                     届いていなければ <tr><td colspan="6">進行中（起動 HH:MM）</td></tr>、
                     併走なしなら <tr><td colspan="6">併走なし（理由）</td></tr>
    __NOTES__        <li>…</li> の列。無ければ <li>なし</li>
    __PLAN_PATH__    保存した plan.md のリポジトリ相対パス
    __UPDATED__      YYYY-MM-DD HH:MM
  footer の「更新: … ／ 現在: …」は plan-step.py が正規表現で書き換えるので、全角スラッシュ区切りの書式を保つこと。
  <style id="pr-tour-figure">・<script id="pr-tour-lightbox">・<script id="pr-tour-copy"> は、見る場所の表示、図の拡大表示、
  パスのコピーの仕組み。プレースホルダは無いのでそのまま残す。パスのコピーは <code> の中身がパスに見えるもの
  （/ を含むか拡張子があり、末尾に :行 や :行-行 が付いてもよい）に自動で付くので、パスは必ず <code> で囲む。
  このテンプレートより前に作った HTML には plan-step.py --upgrade で同じブロックを差し込める（id="pr-tour-*" をすべて）。
-->
