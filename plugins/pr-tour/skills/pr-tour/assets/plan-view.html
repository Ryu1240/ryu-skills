<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
/>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1c2430;
    --muted: #5f6b7a;
    --line: #dfe4ec;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --new: #16a34a;
    --new-soft: #dcfce7;
    --mod: #d97706;
    --mod-soft: #fef3c7;
    --ctx: #6b7280;
    --ctx-soft: #f3f4f6;
    --test: #7c3aed;
    --test-soft: #ede9fe;
    --done: #9ca3af;
    --warn-soft: #fff7ed;
    --warn: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1418;
      --card: #171d24;
      --ink: #e4e8ee;
      --muted: #94a0ae;
      --line: #273039;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --new: #4ade80;
      --new-soft: #14361f;
      --mod: #fbbf24;
      --mod-soft: #3b2f0b;
      --ctx: #9aa3ad;
      --ctx-soft: #23272d;
      --test: #a78bfa;
      --test-soft: #2b2145;
      --done: #6b7280;
      --warn-soft: #3a2411;
      --warn: #fb923c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1418;
    --card: #171d24;
    --ink: #e4e8ee;
    --muted: #94a0ae;
    --line: #273039;
    --accent: #60a5fa;
    --accent-soft: #1e3a5f;
    --new: #4ade80;
    --new-soft: #14361f;
    --mod: #fbbf24;
    --mod-soft: #3b2f0b;
    --ctx: #9aa3ad;
    --ctx-soft: #23272d;
    --test: #a78bfa;
    --test-soft: #2b2145;
    --done: #6b7280;
    --warn-soft: #3a2411;
    --warn: #fb923c;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font:
      14px/1.65 "IBM Plex Sans JP",
      "Hiragino Sans",
      "Noto Sans JP",
      system-ui,
      sans-serif;
    font-variant-numeric: tabular-nums;
  }
  code {
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  h1,
  h2,
  h3 {
    text-wrap: balance;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  header h1 {
    font-size: 20px;
    margin: 0 0 6px;
    line-height: 1.4;
  }
  header .meta {
    color: var(--muted);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
  }
  header .meta a {
    color: var(--accent);
    text-decoration: none;
  }
  .progress {
    margin: 14px 0 26px;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress > div {
    height: 100%;
    background: var(--accent);
    width: __PROGRESS_PCT__%;
    transition: width 0.3s;
  }
  @media (prefers-reduced-motion: reduce) {
    .progress > div {
      transition: none;
    }
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
    font-size: 12px;
  }
  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .tag.new {
    background: var(--new-soft);
    color: var(--new);
  }
  .tag.mod {
    background: var(--mod-soft);
    color: var(--mod);
  }
  .tag.ctx {
    background: var(--ctx-soft);
    color: var(--ctx);
  }
  .tag.test {
    background: var(--test-soft);
    color: var(--test);
  }
  .tag.find {
    background: var(--warn-soft);
    color: var(--warn);
  }
  h2 {
    font-size: 12px;
    margin: 34px 0 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  .route {
    margin-bottom: 26px;
  }
  .route h3 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  .stepper {
    position: relative;
    padding-left: 40px;
  }
  .stepper::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 14px;
    bottom: 14px;
    width: 2px;
    background: var(--line);
  }
  .step {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .step .num {
    position: absolute;
    left: -40px;
    top: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--line);
    color: var(--muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }
  .step.done {
    opacity: 0.72;
  }
  .step.done .num {
    background: var(--done);
    border-color: var(--done);
    color: #fff;
  }
  .step.current {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .step.current .num {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .step .title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .step .title .star {
    color: var(--mod);
    margin-left: 4px;
  }
  .step .files {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 8px 0;
  }
  .step .files > div {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }
  .step .files .why {
    color: var(--muted);
    font-size: 12px;
  }
  .step .files code {
    font-size: 12px;
    background: var(--ctx-soft);
    padding: 1px 6px;
    border-radius: 4px;
    word-break: break-all;
  }
  .step .desc,
  .step .tests,
  .step .link,
  .step .findings {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  .step .tests b,
  .step .link b,
  .step .desc b,
  .step .findings b {
    color: var(--ink);
    font-weight: 600;
  }
  .step .findings {
    border-left: 3px solid var(--warn);
    padding-left: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  th,
  td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
  }
  tr:last-child td {
    border-bottom: none;
  }
  td.none {
    color: var(--warn);
    background: var(--warn-soft);
  }
  td.verdict {
    white-space: nowrap;
    font-weight: 600;
  }
  .table-wrap {
    overflow-x: auto;
  }
  .notes {
    border-left: 3px solid var(--warn);
    padding: 2px 0 2px 14px;
    font-size: 13px;
  }
  .notes ol {
    margin: 0;
    padding-left: 18px;
  }
  .notes li + li {
    margin-top: 4px;
  }
  footer {
    margin-top: 30px;
    color: var(--muted);
    font-size: 12px;
  }
  details.explain {
    margin-top: 10px;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  details.explain summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    list-style: none;
  }
  details.explain summary::before {
    content: "▸ ";
  }
  details.explain[open] summary::before {
    content: "▾ ";
  }
  details.explain summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  details.explain figure {
    margin: 10px 0 14px;
  }
  details.explain svg {
    max-width: 100%;
    height: auto;
    display: block;
    color: var(--ink);
  }
  details.explain figcaption {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  details.explain .pending {
    color: var(--muted);
    font-style: italic;
    font-size: 13px;
  }
  details.explain .topics {
    font-size: 12px;
    color: var(--muted);
    margin: 6px 0 0;
  }
  details.explain .topics span {
    display: inline-block;
    background: var(--test-soft);
    color: var(--test);
    border-radius: 999px;
    padding: 0 8px;
    margin: 2px 4px 2px 0;
  }
  details.explain ul.findings {
    margin: 8px 0 0;
    padding-left: 0;
    list-style: none;
    font-size: 13px;
  }
  details.explain ul.findings li {
    border-left: 3px solid var(--warn);
    background: var(--warn-soft);
    padding: 4px 10px;
    margin: 4px 0;
    border-radius: 0 6px 6px 0;
  }
  details.explain ul.findings li::before {
    content: "🔍 ";
  }
</style>
<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <div class="meta">__META__</div>
    <div class="progress"><div></div></div>
    <div class="legend">
      <span class="tag new">🆕 追加</span>
      <span class="tag mod">✏️ 変更</span>
      <span class="tag ctx">📖 文脈のみ（差分に無い）</span>
      <span class="tag test">🧪 テスト</span>
      <span class="tag find">🔍 code-review の指摘</span>
      <span class="tag" style="border-color: var(--accent); color: var(--accent)">現在のステップ</span>
    </div>
  </header>

  <h2>処理の流れ</h2>
  __ROUTES__

  <h2>テスト対応</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>変更箇所</th>
          <th>テスト</th>
          <th>固定している振る舞い</th>
          <th>備考</th>
        </tr>
      </thead>
      <tbody>
        __TESTS__
      </tbody>
    </table>
  </div>

  <h2>敵対的レビューの指摘（code-review）</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>判定</th>
          <th>場所</th>
          <th>要点</th>
          <th>Step</th>
          <th>状態</th>
        </tr>
      </thead>
      <tbody>
        __FINDINGS__
      </tbody>
    </table>
  </div>

  <h2>未確認・食い違い</h2>
  <div class="notes">
    <ol>
      __NOTES__
    </ol>
  </div>

  <footer>プランファイル: <code>__PLAN_PATH__</code> ／ 更新: __UPDATED__ ／ 現在: 未開始</footer>
</div>
<!--
  テンプレートの使い方（SKILL.md の Phase 4-8 / Phase 5-4）

  置換するプレースホルダ:
    __TITLE__        「PR ツアー #123」のような短い名前（ブラウザタブ・ギャラリーに出る。説明文は付けない）
    __META__         PR タイトル・URL（<a>）・base/head・状態 を <span> で並べる
    __PROGRESS_PCT__ 0（以後は plan-step.py が書き換える）
    __ROUTES__       ルートごとに次の構造を繰り返す
                       <section class="route"><h3>ルート A: 〜</h3><div class="stepper">
                         <article class="step" id="step-1">
                           <div class="num">1</div>
                           <div class="title">ステップ名<span class="star">⭐</span></div>
                           <div class="files">見る場所を 1 行 1 ファイルで:
                             <div><span class="tag ctx">📖</span><code>path:12-20</code><span class="why">何のために見るか</span></div>
                           </div>
                           <div class="desc"><b>説明:</b> 2〜3 行</div>
                           <div class="tests"><b>テスト:</b> 🧪 tests/... の '...'／なし</div>
                           <div class="findings"><b>指摘:</b> 🔍 #2 CONFIRMED path:57 …／レビュー進行中</div>（指摘が無いステップでは省く）
                           <div class="link"><b>つながり:</b> …</div>
                           <details class="explain"><summary>図解</summary>
                             <p class="pending">このステップに到達したときに図解を追記する。</p>
                           </details>
                         </article>
                       </div></section>
                     補足ステップも同じ構造で <h3>補足</h3> の下に置く。
                     <details class="explain"> の中身は Phase 5 で plan-step.py --figure が置き換える。
                     解説の文章はここに書かず、チャットに出す
    __TESTS__        <tr><td>Step 2 Order#cancel</td><td>🧪 tests/...:80-98</td><td>…</td><td>…</td></tr>
                     テストが無い行は <td class="none">なし</td>
    __FINDINGS__     <tr><td>2</td><td class="verdict">CONFIRMED</td><td><code>path:57</code></td><td>…</td><td>Step 4</td><td>未実測</td></tr>
                     届いていなければ <tr><td colspan="6">進行中（起動 HH:MM）</td></tr>、
                     併走なしなら <tr><td colspan="6">併走なし（理由）</td></tr>
    __NOTES__        <li>…</li> の列。無ければ <li>なし</li>
    __PLAN_PATH__    保存した plan.md のリポジトリ相対パス
    __UPDATED__      YYYY-MM-DD HH:MM
  footer の「更新: … ／ 現在: …」は plan-step.py が正規表現で書き換えるので、全角スラッシュ区切りの書式を保つこと。
-->
